<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vella — Conoce personas por videollamada</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #111;
    color: #eee;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid #262626;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
  }
  .logo span { color: #d4537e; }
  .loginBtn {
    background: #7C2D46;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    color: #ddd;
    margin-bottom: 18px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .model-card {
    background: #1a1a1a;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .model-photo {
    width: 100%;
    aspect-ratio: 3/4;
    background: #222 center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 13px;
  }
  .model-info {
    padding: 10px 12px;
  }
  .model-name {
    font-weight: 700;
    font-size: 14px;
    color: #fff;
  }
  .empty {
    color: #777;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="logo">Ve<span>lla</span></div>
  <a class="loginBtn" href="login.html">Iniciar sesión / Registrarme</a>
</header>

<main>
  <h1>Modelos disponibles</h1>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">Aún no hay modelos verificadas disponibles.</div>
</main>

<script>
  const SUPABASE_URL = "https://yfvnifvwixvkfapprczp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_YXW7x-9pGV6eRUzUCMBoaw_fGbRvkRr";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function cargarModelos() {
    const { data, error } = await supabase
      .from("profiles")
      .select("id, name, avatar_url")
      .eq("gender", "femenino")
      .eq("is_verified", true);

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");

    if (error) {
      grid.innerHTML = "<p style='color:#f28b8b'>Error cargando modelos: " + error.message + "</p>";
      return;
    }

    if (!data || data.length === 0) {
      empty.classList.remove("hidden");
      return;
    }

    grid.innerHTML = data.map(function (m) {
      const foto = m.avatar_url
        ? "background-image:url(" + m.avatar_url + ")"
        : "";
      const inicial = m.avatar_url ? "" : (m.name ? m.name[0].toUpperCase() : "?");
      return (
        '<a class="model-card" href="perfil.html?id=' + m.id + '">' +
          '<div class="model-photo" style="' + foto + '">' + inicial + '</div>' +
          '<div class="model-info"><div class="model-name">' + m.name + '</div></div>' +
        '</a>'
      );
    }).join("");
  }

  cargarModelos();
</script>

</body>
</html>
